version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: fishtank_db
    restart: always
    environment:
      MYSQL_DATABASE: my_myfishtank
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - ./webApp/DB/localhost.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/mysql

  web:
    build: .
    container_name: fishtank_web
    restart: always
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASS: ""
      DB_NAME: my_myfishtank
    volumes:
      - ./webApp/code:/var/www/html
    depends_on:
      - db

volumes:
  db_data:
